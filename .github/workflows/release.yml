# Builds deephack and publishes it as a GitHub release.
#
# To release: set __version__ in deephack/__init__.py, write the version's section in CHANGELOG.md
# ("## 0.2.0 (2026-11-20)" and what changed), commit, then push a tag of that version:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The release's notes are that section (packaging/release_notes.py), with how to install after it.
#
# The release gets the standalone app (a zip with deephack.exe, no Python needed), the wheel and the source
# archive, and their checksums. "Run workflow" on the Actions page is a trial run: it tests and builds the
# same files and keeps them with the run, and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,package]"

      - name: Test
        run: python -m pytest -q

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import deephack; print(deephack.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but deephack/__init__.py says version $version."
            exit 1
          fi
          # The release's notes are this version's section of CHANGELOG.md. Asked for here, before anything
          # is built, and in a trial run too: a version without its section does not get as far as a tag.
          python packaging/release_notes.py "$version"

      - name: Build the wheel and the source archive
        run: python -m build

      - name: Build the app
        run: pyinstaller --noconfirm packaging/deephack.spec

      # What the app loads only when it is needed does not show in its window when it is missing. yt-dlp is
      # such a thing: a build without it started fine and could not play one link.
      - name: Check what the app carries
        shell: bash
        run: grep -q "'yt_dlp.YoutubeDL'" build/deephack/PYZ-00.toc

      # The built app, started for real: without a cooler, with fresh settings. It saves a picture of its
      # window after a few seconds and quits; a missing module or DLL would end it before that.
      - name: Try the app
        shell: bash
        run: |
          timeout 120 dist/deephack/deephack.exe --no-device --config "$RUNNER_TEMP/settings.json" --screenshot window.png
          test -s window.png

      - name: Pack
        id: pack
        shell: pwsh
        run: |
          $zip = "deephack-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/deephack -DestinationPath "dist/$zip"
          $files = Get-ChildItem dist -File
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: deephack-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            window.png
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release_notes.py "${{ steps.version.outputs.version }}" -o notes.md
          cat >> notes.md <<'EOF'

          **To install:** download `${{ steps.pack.outputs.zip }}`, unpack it anywhere and run `deephack.exe`. Windows 10 or 11; no Python needed. The app is not signed, so Windows may ask before it runs it the first time ("More info", then "Run anyway").

          The `.whl` and `.tar.gz` are for installing with pip into a Python of your own (3.11 or newer). `SHA256SUMS.txt` has the files' checksums.

          EOF
          files=(dist/*.zip dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then      # run again for the same tag
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes \
              --title "deephack ${{ steps.version.outputs.version }}" --notes-file notes.md
          fi
