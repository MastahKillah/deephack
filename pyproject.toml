[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deephack"
dynamic = ["version"]                    # deephack.__version__: the one place it is written
description = "Custom content (now playing, weather, ...) for the DeepCool MYSTIQUE cooler LCD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyusb>=1.3",
    "libusb-package>=1.0.26",
    "pillow>=10.1",
    "PySide6-Essentials>=6.6",
    "winrt-runtime>=3",
    "winrt-Windows.Foundation>=3",
    "winrt-Windows.Foundation.Collections>=3",
    "winrt-Windows.Media>=3",
    "winrt-Windows.Media.Control>=3",
    "winrt-Windows.Storage.Streams>=3",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest"]
package = ["pyinstaller>=6", "build"]    # for the standalone app and the wheel, see packaging/
emu = ["unicorn>=2.1", "capstone>=5",     # for tools/emu: running the stock firmware in an emulator
       "keystone-engine>=0.9.2"]          # for tools/fw: assembling the direct drawing patch

[project.gui-scripts]
deephack = "deephack.app:main"

[tool.setuptools.packages.find]
include = ["deephack*"]

[tool.setuptools.dynamic]
version = {attr = "deephack.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
